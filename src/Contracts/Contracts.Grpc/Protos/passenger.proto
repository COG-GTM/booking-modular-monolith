syntax = "proto3";

// Canonical passenger gRPC contract (single source of truth, owned by the Passenger service).
// Wire identity: the proto package `passenger` and the service/method names form the gRPC path
// (`/passenger.PassengerGrpcService/<Method>`); never rename them, change field numbers/types or reuse
// removed tags. See docs/adr/0102-shared-grpc-contracts-and-service-addressing.md.
package passenger;

option csharp_namespace = "Passenger";

service PassengerGrpcService {

  rpc GetById (GetByIdRequest) returns (GetPassengerByIdResult);
}

message GetByIdRequest {
  string Id = 1;
}

message GetPassengerByIdResult {
   PassengerResponse PassengerDto = 1;
}

message PassengerResponse {
  string Id = 1;
  string Name = 2;
  string PassportNumber = 3;
  PassengerType PassengerType = 4;
  int32 Age = 5;
  string Email = 6;
}


    enum PassengerType {
        PASSENGER_TYPE_UNKNOWN = 0;
        PASSENGER_TYPE_MALE = 1;
        PASSENGER_TYPE_FEMALE = 2;
        PASSENGER_TYPE_BABY = 3;
    }

