name: Contracts

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "devin/task-3-buildingblocks-split"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build contracts standalone
        run: dotnet build src/Contracts/Contracts.Messages/Contracts.Messages.csproj -c Release -nologo -v quiet

      - name: Contract tests (dependency surface, compatibility baseline, UserCreated flow)
        run: dotnet test src/Contracts/tests/Contracts.Messages.Tests -c Release -nologo

      - name: Pack to local feed
        run: scripts/pack-contracts.sh

      - name: Consumers against the packaged contract
        run: scripts/verify-contracts-consumer.sh

      - name: Reject a missing local contract package
        run: |
          feed="$(mktemp -d)"
          log="$(mktemp)"
          trap 'rmdir "$feed"; rm -f "$log"' EXIT
          if scripts/verify-contracts-consumer.sh "" "$feed" > "$log" 2>&1; then
            echo "The consumer restored a contract package without a local artifact."
            exit 1
          fi
          cat "$log"
          grep -F 'error NU1101: Unable to find package BookingModularMonolith.Contracts.Messages.' "$log" |
            grep -F 'source(s) were not considered: nuget.org.'

      - uses: actions/upload-artifact@v4
        with:
          name: contracts-nuget
          path: artifacts/nuget/*.nupkg
