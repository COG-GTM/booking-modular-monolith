name: Helm chart

on:
  push:
    branches: [main, devin/ab-488-v2]
    paths:
      - 'deployments/k8s/**'
      - '.github/workflows/helm-chart.yml'
  pull_request:
    branches: [main, devin/ab-488-v2]
    paths:
      - 'deployments/k8s/**'
      - '.github/workflows/helm-chart.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - name: Install kubeconform
        run: |
          set -euo pipefail
          version=v0.6.7
          curl -fsSLo "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/kubeconform-CHECKSUMS" "https://github.com/yannh/kubeconform/releases/download/${version}/CHECKSUMS"
          (cd "$RUNNER_TEMP" && grep 'kubeconform-linux-amd64.tar.gz$' kubeconform-CHECKSUMS | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" -C "$RUNNER_TEMP" kubeconform
          sudo install "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
      - name: Install shellcheck
        run: |
          set -euo pipefail
          version=v0.10.0
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz"
          tar -xf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-${version}/shellcheck" /usr/local/bin/shellcheck
      - name: Lint chart and validate rendered Kubernetes resources
        run: |
          set -euo pipefail
          chart=deployments/k8s/helm/booking
          helm lint "$chart" --set identity.signingKey.existingSecret=ci-signing-key
          helm lint "$chart" --values deployments/k8s/environments/kind.yaml
          helm lint "$chart" --values deployments/k8s/environments/production.yaml

          for values in /dev/null deployments/k8s/environments/kind.yaml deployments/k8s/environments/production.yaml; do
            if [[ "$values" == /dev/null ]]; then
              helm template booking "$chart" --set identity.signingKey.existingSecret=ci-signing-key
            else
              helm template booking "$chart" --values "$values"
            fi | kubeconform -strict -summary -kubernetes-version 1.32.2
          done
      - name: Check invalid configurations fail at render time
        run: |
          set -euo pipefail
          chart=deployments/k8s/helm/booking
          if helm template booking "$chart" --set identity.signingKey.existingSecret=ci-signing-key --set services.booking.replicas=2 >"$RUNNER_TEMP/booking-replicas.yaml" 2>&1; then
            echo "Booking with two replicas unexpectedly rendered successfully" >&2
            exit 1
          fi
          grep -q 'Booking background processing cannot use multiple replicas' "$RUNNER_TEMP/booking-replicas.yaml"

          if helm template booking "$chart" --set identity.signingKey.existingSecret=ci-signing-key --set services.identity.replicas=2 >"$RUNNER_TEMP/identity-replicas.yaml" 2>&1; then
            echo "Identity with two replicas unexpectedly rendered successfully" >&2
            exit 1
          fi
          grep -q 'Identity background processing cannot use multiple replicas: outbox polling has no row locking' "$RUNNER_TEMP/identity-replicas.yaml"

          if helm template booking "$chart" >"$RUNNER_TEMP/missing-signing-secret.yaml" 2>&1; then
            echo "Missing signing-key Secret unexpectedly rendered successfully" >&2
            exit 1
          fi
          grep -q 'identity.signingKey.existingSecret is required' "$RUNNER_TEMP/missing-signing-secret.yaml"

          if helm template booking "$chart" --set identity.signingKey.existingSecret=ci-signing-key --set services.flight.database.username=BAD-role >"$RUNNER_TEMP/bad-db-identifier.yaml" 2>&1; then
            echo "Invalid database identifier unexpectedly rendered successfully" >&2
            exit 1
          fi
          grep -q 'services.flight.database.username must match' "$RUNNER_TEMP/bad-db-identifier.yaml"

          if helm template booking "$chart" --set identity.signingKey.existingSecret=ci-signing-key --set-string "services.flight.database.password=bad'password" >"$RUNNER_TEMP/db-password-quote.yaml" 2>&1; then
            echo "A chart-managed database password with a single quote unexpectedly rendered successfully" >&2
            exit 1
          fi
          grep -q 'services.flight.database.password must not contain a single quote' "$RUNNER_TEMP/db-password-quote.yaml"
      - name: Shellcheck Kubernetes scripts
        run: find deployments/k8s -type f -name '*.sh' -print0 | xargs -0 shellcheck

  kind-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2
      - name: Install kind
        run: |
          set -euo pipefail
          version=v0.27.0
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: Run kind deployment smoke test
        run: deployments/k8s/kind/smoke.sh
