# Reusable per-service pipeline: build + test the service's projects, then build its container
# image and push it to the registry on main / release tags only. Called by the thin
# service-<name>.yml workflows, which own the triggers and path filters. See docs/ci-cd.md.
name: Service pipeline

on:
  workflow_call:
    inputs:
      service:
        description: Service key (gateway, identity, flight, passenger, booking). Used for the image name (booking-<service>) and per-service release tags (<service>-vX.Y.Z).
        type: string
        required: true
      dockerfile:
        description: Dockerfile path relative to the repository root (build context is the repository root).
        type: string
        required: true
      targets:
        description: 'JSON array of build/test targets: [{"name": "...", "project": "<dir>", "tests": "<dir or empty>"}], each run through .github/actions/build-test.'
        type: string
        required: true
      registry:
        description: Container registry host.
        type: string
        default: ghcr.io

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and test ${{ matrix.name }}
        uses: ./.github/actions/build-test
        with:
          project-path: ${{ matrix.project }}
          tests-path: ${{ matrix.tests }}
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: ${{ matrix.name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image (${{ inputs.service }})
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Push only for pushes to main and release tags; pull requests build the image without pushing.
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        env:
          REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ inputs.service }}
        run: echo "name=${REGISTRY}/${OWNER,,}/booking-${SERVICE}" >> "$GITHUB_OUTPUT"

      # semver tags for v1.2.3 (all services) and <service>-v1.2.3 (this service only);
      # sha-<short> and the branch name for main; pr-<n> for local reference on PR builds (never pushed).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=match,pattern=^${{ inputs.service }}-v(\d+\.\d+\.\d+.*)$,group=1
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build${{ env.PUSH_IMAGE == 'true' && ' and push' || '' }} image
        uses: ./.github/actions/docker-build-publish
        with:
          dockerfile-path: ${{ inputs.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUSH_IMAGE }}
          registry: ${{ inputs.registry }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          cache-scope: booking-${{ inputs.service }}

      - name: Image summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### booking-${{ inputs.service }} image"
            echo "Pushed: ${PUSH_IMAGE}"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
