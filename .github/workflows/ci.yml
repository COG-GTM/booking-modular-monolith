name: CI

# Module pipeline: builds/tests BuildingBlocks, the four modules and the Gateway. The monolith host
# (src/Api) and its booking-monolith image were decommissioned in AB-505; the Gateway and service hosts
# publish their images from their own path-filtered pipelines (service-*.yml). See docs/ci-cd.md.
on:
  push:
    branches: [ "main"]
    # Path filters are not evaluated for tag pushes.
    tags: [ "v*.*.*" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "src/Gateway/**"
      - "src/Services/**"
      - ".github/workflows/service-*.yml"
      - ".github/workflows/packages.yml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/nuget-pack-publish/**"
  pull_request:
    branches: [ "main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "src/Gateway/**"
      - "src/Services/**"
      - ".github/workflows/service-*.yml"
      - ".github/workflows/packages.yml"
      - ".github/workflows/deploy.yml"
      - ".github/actions/nuget-pack-publish/**"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and Test BuildingBlocks
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-buildingblocks-step
        with:
          project-path: 'src/BuildingBlocks/'
          tests-path: 'src/BuildingBlocks/tests/'
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'BuildingBlocks'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack BuildingBlocks Libraries
        if: success()
        shell: bash
        run: bash scripts/pack.sh

      - name: Build and Test Flight Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-flight-step
        with:
          project-path: 'src/Modules/Flight/src/'
          tests-path: 'src/Modules/Flight/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Flight'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Identity Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-identity-step
        with:
          project-path: 'src/Modules/Identity/src/'
          tests-path: 'src/Modules/Identity/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Identity'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Passenger Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-passenger-step
        with:
          project-path: 'src/Modules/Passenger/src/'
          tests-path: 'src/Modules/Passenger/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Passenger'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Booking Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-booking-step
        with:
          project-path: 'src/Modules/Booking/src/'
          tests-path: 'src/Modules/Booking/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Booking'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Gateway
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-gateway-step
        with:
          project-path: 'src/Gateway/src/'
          tests-path: 'src/Gateway/tests/'
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Gateway'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack Contracts.Messages
        if: success()
        run: dotnet pack src/Contracts/Contracts.Messages/Contracts.Messages.csproj -c Release -o artifacts/packages

      - name: Update Release Drafter
        if: ${{ github.ref == 'refs/heads/main' && success() }}
        id: last_release
        uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Version Info
        run:
          echo "Release version is:" ${{ steps.last_release.outputs.tag_name }}
