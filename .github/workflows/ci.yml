name: CI

# Monolith CI: the four modules (consumed by src/Api) plus the cross-service E2E suite.
# The Gateway and standalone service hosts are built, tested and imaged by their own
# path-filtered pipelines (service-*.yml), so changes confined to them do not trigger this workflow.
on:
  push:
    branches: [ "main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "src/Gateway/**"
      - "src/Services/**"
      - ".github/workflows/service-*.yml"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/packages.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [ "main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "src/Gateway/**"
      - "src/Services/**"
      - ".github/workflows/service-*.yml"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/packages.yml"
      - ".github/scripts/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and Test Flight Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-flight-step
        with:
          project-path: 'src/Modules/Flight/src/'
          tests-path: 'src/Modules/Flight/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Flight'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Identity Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-identity-step
        with:
          project-path: 'src/Modules/Identity/src/'
          tests-path: 'src/Modules/Identity/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Identity'
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and Test Passenger Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-passenger-step
        with:
          project-path: 'src/Modules/Passenger/src/'
          tests-path: 'src/Modules/Passenger/tests/Integration.Test/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Passenger'
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Build and Test Booking Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-booking-step
        with:
          project-path: 'src/Modules/Booking/src/'
          tests-path: 'src/Modules/Booking/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Booking'
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Build and Test Contract Tests
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-contracts-step
        with:
          project-path: 'src/Tests/Contracts.Test/'
          tests-path: 'src/Tests/Contracts.Test/'
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Contracts'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Drafter
        if: ${{ github.ref == 'refs/heads/main' && success() }}
        id: last_release
        uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Version Info
        run:
          echo "Release version is:" ${{ steps.last_release.outputs.tag_name }}

  cross-service-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and Test Cross-Service E2E
        uses: ./.github/actions/build-test
        with:
          project-path: 'src/Tests/CrossService.EndToEnd.Test/'
          tests-path: 'src/Tests/CrossService.EndToEnd.Test/'
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'CrossService.E2E'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload E2E host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-service-e2e-host-logs
          path: '**/TestResults/e2e-logs/**'
          if-no-files-found: ignore
