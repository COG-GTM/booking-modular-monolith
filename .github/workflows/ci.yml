name: CI

on:
  push:
    branches: [ "main"]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [ "main"]
    paths-ignore:
      - "README.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block committed signing keys and private key material
        shell: bash
        run: |
          set -euo pipefail

          # Fail if any signing key file (e.g. IdentityServer's tempkey.jwk) is tracked.
          jwk_files="$(git ls-files '*.jwk' '*.pfx' '*.p12' || true)"
          if [ -n "$jwk_files" ]; then
            echo "::error::Committed key/certificate files detected:"
            echo "$jwk_files"
            exit 1
          fi

          # Fail if any tracked file embeds private key material.
          if git grep -nIE -- '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----' \
            -- . ':(exclude).github/workflows/ci.yml' > /tmp/private_key_hits.txt; then
            echo "::error::Private key material detected in tracked files:"
            cat /tmp/private_key_hits.txt
            exit 1
          fi

          # Fail if any tracked file is a JWK that carries the RSA private
          # exponent ("kty":"RSA" alongside "d"), i.e. a private signing key.
          jwk_priv_hits=""
          for f in $(git grep -lIE -- '"kty"[[:space:]]*:[[:space:]]*"RSA"' \
            -- . ':(exclude).github/workflows/ci.yml' || true); do
            if grep -qE '"d"[[:space:]]*:' "$f"; then
              jwk_priv_hits="${jwk_priv_hits}${f}"$'\n'
            fi
          done
          if [ -n "$jwk_priv_hits" ]; then
            echo "::error::JWK containing a private key component committed:"
            echo "$jwk_priv_hits"
            exit 1
          fi

          echo "No committed signing keys or private key material found."

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and Test Flight Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-flight-step
        with:
          project-path: 'src/Modules/Flight/src/'
          tests-path: 'src/Modules/Flight/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Flight'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Identity Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-identity-step
        with:
          project-path: 'src/Modules/Identity/src/'
          tests-path: 'src/Modules/Identity/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Identity'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Passenger Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-passenger-step
        with:
          project-path: 'src/Modules/Passenger/src/'
          tests-path: 'src/Modules/Passenger/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Passenger'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Test Booking Microservice
        uses: ./.github/actions/build-test
        if: success()
        id: build-test-booking-step
        with:
          project-path: 'src/Modules/Booking/src/'
          tests-path: 'src/Modules/Booking/tests/'
          # wildcard search for files with the ".cobertura.xml" extension in all subdirectories of the current directory
          # https://www.jamescroft.co.uk/combining-multiple-code-coverage-results-in-azure-devops/
          # https://stackoverflow.com/questions/53255065/dotnet-unit-test-with-coverlet-how-to-get-coverage-for-entire-solution-and-not
          reports-path: ${{ github.workspace }}/**/*.cobertura.xml
          reports-output-path: ${{ github.workspace }}/output/test-results
          service-name: 'Booking'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Drafter
        if: ${{ github.ref == 'refs/heads/main' && success() }}
        id: last_release
        uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Version Info
        run:
          echo "Release version is:" ${{ steps.last_release.outputs.tag_name }}
