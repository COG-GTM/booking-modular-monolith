name: CI

on:
  push:
    branches: [main, devin/ab-488-v3]
  pull_request:
    branches: [main, devin/ab-488-v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
      packages: ${{ steps.select.outputs.packages }}
      shared: ${{ steps.select.outputs.shared }}
      apphost: ${{ steps.select.outputs.apphost }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test pipeline selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select affected services and packages
        id: select
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 .github/scripts/ci.py select --base "$BEFORE" --head "$AFTER" --force "$FORCE" >> "$GITHUB_OUTPUT"

  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/service.yml
    with:
      service: ${{ matrix.service }}
    permissions:
      contents: read
      packages: write

  apphost:
    needs: changes
    if: needs.changes.outputs.apphost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          project-path: src/Aspire/src/AppHost/AppHost.csproj
          service-name: apphost

  shared-packages:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack shared projects (also validates PRs without publishing)
        run: python3 .github/scripts/ci.py pack --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: shared-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
  publish-packages:
    needs: [changes, shared-packages, package-metadata, service, apphost]
    if: >-
      needs.changes.outputs.packages == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devin/ab-488-v3')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: shared-packages
          path: artifacts/packages
      - name: Publish versioned packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg'
          --source "https://nuget.pkg.github.com/$OWNER/index.json"
          --api-key "$NUGET_AUTH_TOKEN" --skip-duplicate

  package-metadata:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify shared identity on native paths
        shell: bash
        run: |
          dotnet msbuild src/BuildingBlocks/BuildingBlocks.csproj -getProperty:PackageId,PackageVersion > metadata.json
          python3 -c 'import json, xml.etree.ElementTree as E; p=json.load(open("metadata.json", encoding="utf-8-sig"))["Properties"]; v=E.parse("Directory.Build.props").findtext(".//SharedPackageVersion"); assert p == {"PackageId": "Booking.BuildingBlocks", "PackageVersion": v}, p'

  ci:
    name: CI result
    needs: [changes, service, apphost, shared-packages, publish-packages, package-metadata]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected pipelines
        env:
          CHANGES: ${{ needs.changes.result }}
          SERVICES: ${{ needs.service.result }}
          PACKAGES: ${{ needs.shared-packages.result }}
          APPHOST: ${{ needs.apphost.result }}
          PUBLISH: ${{ needs.publish-packages.result }}
          METADATA: ${{ needs.package-metadata.result }}
        run: |
          test "$CHANGES" = success
          test "$SERVICES" = success || test "$SERVICES" = skipped
          test "$PACKAGES" = success || test "$PACKAGES" = skipped
          test "$APPHOST" = success || test "$APPHOST" = skipped
          test "$PUBLISH" = success || test "$PUBLISH" = skipped
          test "$METADATA" = success || test "$METADATA" = skipped

  release-drafter:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
