# Requires two repo/org Actions secrets:
#   DEVIN_WEBHOOK_URL    - the automation's webhook URL
#   DEVIN_WEBHOOK_SECRET - the webhook secret
name: Trigger Devin test generation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  notify-devin:
    runs-on: ubuntu-latest
    steps:
      - name: Call Devin automation webhook
        env:
          WEBHOOK_URL: ${{ secrets.DEVIN_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEVIN_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DEVIN_WEBHOOK_URL secret not configured; skipping."
            exit 0
          fi
          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_url "$PR_URL" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg base_branch "$BASE_BRANCH" \
            --arg pr_title "$PR_TITLE" \
            '{repository: $repository, pr_number: $pr_number, pr_url: $pr_url, head_branch: $head_branch, base_branch: $base_branch, pr_title: $pr_title}')
          curl -sS -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "$payload"
