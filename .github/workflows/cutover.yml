name: Cutover tooling

on:
  push:
    branches: ["main", "devin/ab-488-v3"]
    paths:
      - ".github/workflows/cutover.yml"
      - "deployments/docker-compose/**"
      - "scripts/cutover/**"
      - "src/Gateway/**"
      - "src/Aspire/**"
      - "src/Services/**"
      - "scripts/smoke/**"
      - "booking-modular-monolith.sln"
  pull_request:
    branches: ["main", "devin/ab-488-v3"]
    paths:
      - ".github/workflows/cutover.yml"
      - "deployments/docker-compose/**"
      - "scripts/cutover/**"
      - "src/Gateway/**"
      - "src/Aspire/**"
      - "src/Services/**"
      - "scripts/smoke/**"
      - "booking-modular-monolith.sln"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Test gateway and AppHost
        run: |
          dotnet test src/Gateway/tests/Gateway.Test/Gateway.Test.csproj
          dotnet test src/Aspire/tests/AppHost.Test/AppHost.Test.csproj

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check cutover scripts
        run: shellcheck scripts/cutover/*.sh

      - name: Validate Compose configurations
        run: |
          docker compose -f deployments/docker-compose/docker-compose.yaml config --quiet
          docker compose \
            -f deployments/docker-compose/docker-compose.yaml \
            -f deployments/docker-compose/docker-compose.cutover.yaml \
            config --quiet

  drill:
    needs: cutover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build legacy monolith image
        run: scripts/cutover/build-legacy-monolith.sh

      - name: Build service images
        run: |
          docker compose -f deployments/docker-compose/docker-compose.yaml build \
            gateway identity-service flight-service passenger-service booking-service

      - name: Run cutover and rollback drill
        run: |
          scripts/cutover/cutover.sh up
          scripts/cutover/validate-rollback.sh flight
          scripts/cutover/validate-token-continuity.sh
          scripts/cutover/cutover.sh all
          scripts/cutover/cutover.sh decommission
          scripts/smoke/compose-e2e.sh

      - name: Dump Compose state on failure
        if: failure()
        run: |
          docker compose \
            -f deployments/docker-compose/docker-compose.yaml \
            -f deployments/docker-compose/docker-compose.cutover.yaml ps
          docker compose \
            -f deployments/docker-compose/docker-compose.yaml \
            -f deployments/docker-compose/docker-compose.cutover.yaml logs --no-color

      - name: Tear down drill stack
        if: always()
        run: |
          docker compose \
            -f deployments/docker-compose/docker-compose.yaml \
            -f deployments/docker-compose/docker-compose.cutover.yaml down -v
