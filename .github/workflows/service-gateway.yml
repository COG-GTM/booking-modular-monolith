# Gateway pipeline: build/test, then image booking-gateway. Runs only when the Gateway host,
# its module, or a shared input it builds from changes. Logic lives in _service-pipeline.yml.
name: Service - Gateway

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes: v* releases every service, gateway-v* only this one.
    tags: ["v*.*.*", "gateway-v*.*.*"]
    paths:
      - "src/Gateway/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts.Grpc/**"
      - "src/Contracts.Messages/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "Directory.*.props"
      - "global.json"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/service-gateway.yml"
  pull_request:
    paths:
      - "src/Gateway/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts.Grpc/**"
      - "src/Contracts.Messages/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "Directory.*.props"
      - "global.json"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/service-gateway.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: gateway
      dockerfile: src/Gateway/Dockerfile
      targets: >-
        [
          {"name": "Gateway", "project": "src/Gateway/src/", "tests": "src/Gateway/tests/"}
        ]
