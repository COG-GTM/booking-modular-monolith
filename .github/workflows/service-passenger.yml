# Passenger pipeline: build/test, then image booking-passenger (pushed on main and release tags).
# Path-filtered so it runs only when the Passenger service or a shared input it builds from
# changes. Logic lives in _service-pipeline.yml; see docs/ci-cd.md.
name: Service - Passenger

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes: v* releases every service, passenger-v* only this one.
    tags: ["v*.*.*", "passenger-v*.*.*"]
    paths:
      - "src/Services/Passenger.Host/**"
      - "src/Modules/Passenger/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "Directory.*.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - ".github/actions/build/**"
      - ".github/actions/build-test/**"
      - ".github/actions/test/**"
      - ".github/actions/docker-build-publish/**"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/service-passenger.yml"
  pull_request:
    paths:
      - "src/Services/Passenger.Host/**"
      - "src/Modules/Passenger/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "Directory.*.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".dockerignore"
      - ".config/dotnet-tools.json"
      - ".github/actions/build/**"
      - ".github/actions/build-test/**"
      - ".github/actions/test/**"
      - ".github/actions/docker-build-publish/**"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/service-passenger.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: passenger
      dockerfile: src/Services/Passenger.Host/Dockerfile
      targets: >-
        [
          {"name": "Passenger", "project": "src/Modules/Passenger/src/", "tests": "src/Modules/Passenger/tests/"},
          {"name": "Passenger.Host", "project": "src/Services/Passenger.Host/src/", "tests": "src/Services/Passenger.Host/tests/"}
        ]
