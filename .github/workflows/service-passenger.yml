# Passenger pipeline: build/test, then image booking-passenger. Runs only when the Passenger host,
# its module, or a shared input it builds from changes. Logic lives in _service-pipeline.yml.
name: Service - Passenger

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes: v* releases every service, passenger-v* only this one.
    tags: ["v*.*.*", "passenger-v*.*.*"]
    paths:
      - "src/Services/Passenger.Host/**"
      - "src/Modules/Passenger/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts.Grpc/**"
      - "src/Contracts.Messages/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "Directory.*.props"
      - "global.json"
      - ".dockerignore"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/service-passenger.yml"
  pull_request:
    paths:
      - "src/Services/Passenger.Host/**"
      - "src/Modules/Passenger/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts.Grpc/**"
      - "src/Contracts.Messages/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "Directory.*.props"
      - "global.json"
      - ".dockerignore"
      - ".editorconfig"
      - ".github/actions/**"
      - ".github/workflows/_service-pipeline.yml"
      - ".github/workflows/service-passenger.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_service-pipeline.yml
    with:
      service: passenger
      dockerfile: src/Services/Passenger.Host/Dockerfile
      targets: >-
        [
          {"name": "Passenger", "project": "src/Modules/Passenger/src/", "tests": "src/Modules/Passenger/tests/Integration.Test/"},
          {"name": "PassengerHost", "project": "src/Services/Passenger.Host/", "tests": "src/Modules/Passenger/tests/Host.Test/"}
        ]
