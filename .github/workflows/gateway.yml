name: Gateway

on:
  push:
    branches: ["devin/task-15-yarp-gateway"]
  pull_request:
    branches: ["main", "devin/task-3-buildingblocks-split"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build gateway
        run: dotnet build src/Gateway/src/Gateway.csproj -c Release -nologo
      - name: Test gateway
        run: dotnet test src/Gateway/tests/Gateway.Test -c Release -nologo
