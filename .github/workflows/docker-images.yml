# Monolith image and compose validation. The Gateway and service images are built (and pushed on
# main/tags) by their own path-filtered pipelines: see service-*.yml and docs/ci-cd.md.
name: Docker images

on:
  pull_request:
    paths:
      - "src/Api/**"
      - "src/Modules/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts.Grpc/**"
      - "src/Contracts.Messages/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "deployments/docker-compose/**"
      - "Directory.*.props"
      - "global.json"
      - ".editorconfig"
      - ".dockerignore"
      - ".github/workflows/docker-images.yml"
  push:
    branches: [main]
    paths:
      - "src/Api/**"
      - "src/Modules/**"
      - "src/BuildingBlocks/**"
      - "src/Contracts.Grpc/**"
      - "src/Contracts.Messages/**"
      - "src/Aspire/src/ServiceDefaults/**"
      - "deployments/docker-compose/**"
      - "Directory.*.props"
      - "global.json"
      - ".editorconfig"
      - ".dockerignore"
      - ".github/workflows/docker-images.yml"

jobs:
  build-monolith-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build src/Api/Dockerfile
        run: docker build -f src/Api/Dockerfile .

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate monolith compose
        run: docker compose -f deployments/docker-compose/docker-compose.yaml config -q
      - name: Validate multi-service compose
        run: docker compose -f deployments/docker-compose/docker-compose.services.yaml config -q
