name: Test
description: Run every selected test project and propagate failures
inputs:
  tests-path:
    description: Test directory
    required: true
  reports-path:
    description: Test report glob
    required: true
  reports-output-path:
    description: Test report output directory
    required: true
  service-name:
    description: Service name
    required: true
  token:
    description: Unused compatibility input; reporting no longer requires API write access
    required: false
  no-restore:
    description: Skip restore only when all test projects have already been restored
    default: 'false'
runs:
  using: composite
  steps:
    - name: Tests
      shell: bash
      env:
        TESTS: ${{ inputs.tests-path }}
        NO_RESTORE: ${{ inputs.no-restore }}
      run: |
        status=0
        count=0
        args=()
        if [ "$NO_RESTORE" = true ]; then args+=(--no-restore); fi
        while IFS= read -r -d '' project; do
          count=$((count + 1))
          dotnet test "$project" -c Release "${args[@]}" --logger trx || status=1
        done < <(find "$TESTS" -name '*.csproj' -type f -print0 | sort -z)
        test "$count" -gt 0
        exit "$status"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.service-name }}-test-results
        path: ${{ inputs.tests-path }}/**/TestResults/*.trx
        if-no-files-found: warn
