name: Build and publish Docker image
description: Build from the repository root; publish only when explicitly requested
inputs:
  tag-name:
    description: Source image version (sha-<full commit>); pin digests for immutable deployments
    required: true
  image-name:
    description: Image path below the registry namespace
    required: true
  registry:
    description: Container registry
    default: ghcr.io
  registry-username:
    description: Registry login user
    required: true
  registry-password:
    description: Short-lived registry token (not needed for build-only runs)
    required: false
    default: ''
  namespace:
    description: Registry namespace (defaults to the repository owner)
    default: ${{ github.repository_owner }}
  dockerfile-path:
    description: Dockerfile relative to the repository root
    required: true
  push:
    description: Explicitly enable registry login and push
    default: 'false'
outputs:
  image:
    description: Fully qualified image reference
    value: ${{ steps.image.outputs.reference }}
runs:
  using: composite
  steps:
    - name: Resolve image reference
      id: image
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag-name }}
      run: echo "reference=${REGISTRY,,}/${NAMESPACE,,}/${IMAGE,,}:$TAG" >> "$GITHUB_OUTPUT"
    - name: Login to registry
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
    - name: Build image
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.reference }}
        DOCKERFILE: ${{ inputs.dockerfile-path }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}
        REVISION: ${{ github.sha }}
      run: >-
        docker build --label "org.opencontainers.image.source=$SOURCE"
        --label "org.opencontainers.image.revision=$REVISION"
        -t "$IMAGE" -f "$DOCKERFILE" .
    - name: Push image
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.reference }}
      run: |
        docker push "$IMAGE"
        echo "Published \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
