name: Build and publish Docker image
description: Build on every call; authenticate and publish only when explicitly requested
inputs:
  tag-name:
    description: Version tag (service pipelines use sha-<full commit SHA>)
    required: true
  image-name:
    description: Image repository including namespace, e.g. cog-gtm/booking-flight
    required: true
  registry:
    description: Container registry hostname
    default: docker.io
  registry-username:
    description: Registry username (only needed when publishing)
    required: false
  registry-password:
    description: Registry password (only needed when publishing)
    required: false
  dockerfile-path:
    description: Dockerfile path relative to repository root
    required: true
  push:
    description: Explicit opt-in to publishing; PR callers must leave this false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Login to registry
      if: inputs.push == 'true' && github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}
    - name: Build image
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag-name }}
        DOCKERFILE: ${{ inputs.dockerfile-path }}
      run: |
        docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --tag "$IMAGE" --file "$DOCKERFILE" .
    - name: Publish image
      if: inputs.push == 'true' && github.event_name != 'pull_request'
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag-name }}
      run: |
        docker push "$IMAGE"
        echo "Published `$IMAGE`" >> "$GITHUB_STEP_SUMMARY"
