name: "Publish and Build Docker"
description: "Build a Docker image with Buildx and optionally push it to a registry"

# Input parameters allow you to specify data that the action expects to use during runtime. GitHub stores input parameters as environment variables.(so they are just string)
# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#inputs
inputs:
  dockerfile-path:
    description: "Dockerfile path, relative to the repository root"
    required: true
  context:
    description: "Docker build context"
    required: false
    default: "."
  tags:
    description: "Newline-separated fully qualified image references (e.g. docker/metadata-action `tags` output). When empty, <registry-username>/<image-name>:<tag-name> is used."
    required: false
    default: ""
  labels:
    description: "Newline-separated OCI labels"
    required: false
    default: ""
  tag-name:
    description: "Tag name (legacy; used only when `tags` is empty)"
    required: false
    default: ""
  image-name:
    description: "Image name (legacy; used only when `tags` is empty)"
    required: false
    default: ""
  push:
    description: "'true' pushes, 'false' only builds, 'auto' pushes for push events on refs/heads/main only"
    required: false
    default: "auto"
  registry:
    description: "Registry host to log in to (empty = Docker Hub)"
    required: false
    default: ""
  registry-username:
    description: "Registry username"
    required: false
    default: ""
  registry-password:
    description: "Registry password"
    required: false
    default: ""
  cache-scope:
    description: "GitHub Actions cache scope for Buildx layer caching (empty disables the cache)"
    required: false
    default: ""

outputs:
  pushed:
    description: "'true' when the image was pushed"
    value: ${{ steps.resolve.outputs.push }}
  digest:
    description: "Image digest (set when pushed)"
    value: ${{ steps.build.outputs.digest }}

# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#runs-for-composite-actions
runs:
  using: "composite"
  steps:
    - name: Resolve tags and push mode
      id: resolve
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        TAG_NAME: ${{ inputs.tag-name }}
        IMAGE_NAME: ${{ inputs.image-name }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        PUSH: ${{ inputs.push }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
      run: |
        if [ -z "$TAGS" ]; then
          if [ -z "$IMAGE_NAME" ] || [ -z "$TAG_NAME" ]; then
            echo "::error::Either 'tags' or both 'image-name' and 'tag-name' are required"
            exit 1
          fi
          TAGS="${REGISTRY_USERNAME:+$REGISTRY_USERNAME/}${IMAGE_NAME}:${TAG_NAME}"
        fi
        if [ "$PUSH" = "auto" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then PUSH=true; else PUSH=false; fi
        fi
        # Never push from pull_request events (forks or not): PRs only prove the image builds.
        case "$GITHUB_EVENT_NAME" in
          pull_request|pull_request_target) PUSH=false ;;
        esac
        if [ -n "$CACHE_SCOPE" ]; then
          echo "cache-from=type=gha,scope=$CACHE_SCOPE" >> "$GITHUB_OUTPUT"
          echo "cache-to=type=gha,mode=max,scope=$CACHE_SCOPE" >> "$GITHUB_OUTPUT"
        fi
        {
          echo "push=$PUSH"
          echo "tags<<EOF_TAGS"
          echo "$TAGS"
          echo "EOF_TAGS"
        } >> "$GITHUB_OUTPUT"
        echo "Docker tags (push=$PUSH):"
        echo "$TAGS"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    ##ref: https://docs.docker.com/language/golang/configure-ci-cd/
    ##ref: https://event-driven.io/en/how_to_buid_and_push_docker_image_with_github_actions
    - name: Login to registry
      if: ${{ steps.resolve.outputs.push == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build (and push when enabled) Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile-path }}
        tags: ${{ steps.resolve.outputs.tags }}
        labels: ${{ inputs.labels }}
        push: ${{ steps.resolve.outputs.push == 'true' }}
        cache-from: ${{ steps.resolve.outputs.cache-from }}
        cache-to: ${{ steps.resolve.outputs.cache-to }}
