name: Build
description: Build only the selected project and its dependencies
inputs:
  project-path:
    description: Project file or directory
    required: true
  service-name:
    description: Service name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install tooling and check formatting
      shell: bash
      run: |
        npm ci
        npm run ci-format
    - name: Build selected service
      shell: bash
      env:
        PROJECT: ${{ inputs.project-path }}
      run: dotnet build "$PROJECT" -c Release
