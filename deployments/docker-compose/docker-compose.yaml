name: booking-modular-monolith

# Multi-service topology: gateway + identity/flight/passenger/booking services on top of the shared
# infrastructure in docker-compose.infrastructure.yaml. Only the gateway is public (:5000).
# The monolith is retired; previous-release recovery uses the explicit rollback overlay.

include:
  - docker-compose.infrastructure.yaml

x-dotnet-healthcheck: &dotnet-healthcheck
  # aspnet images ship without curl; probe /health/ready over bash /dev/tcp.
  test:
    - CMD
    - bash
    - -c
    - >-
      exec 3<>/dev/tcp/127.0.0.1/8080 &&
      printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
      head -n 1 <&3 | grep -q ' 200 '
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: docker
  Jwt__Authority: http://localhost:5000
  Jwt__Audience: booking-modular-monolith
  Jwt__MetadataAddress: http://identity-service:8080/.well-known/openid-configuration
  Messaging__Transport: RabbitMq
  RabbitMqOptions__HostName: rabbitmq
  RabbitMqOptions__Port: "5672"
  RabbitMqOptions__UserName: ${RABBITMQ_USERNAME:-guest}
  RabbitMqOptions__Password: ${RABBITMQ_PASSWORD:-guest}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  ObservabilityOptions__UseOTLPExporter: "true"
  ObservabilityOptions__UseAspireOTLPExporter: "false"
  ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317

x-infra-dependencies: &infra-dependencies
  postgres:
    condition: service_healthy
  mongo:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  #######################################################
  #  identity-service (token issuer, publishes UserCreated)
  #######################################################
  identity-service:
    image: booking-identity-service:local
    build:
      context: ../../
      dockerfile: src/Services/Identity.Host/Dockerfile
    container_name: identity-service
    restart: unless-stopped
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: identity-service
      ObservabilityOptions__ServiceName: identity-service
      AuthOptions__IssuerUri: http://localhost:5000
      AuthOptions__SigningKeyPath: /app/keys/tempkey.jwk
      Jwt__MetadataAddress: http://localhost:8080/.well-known/openid-configuration
      PostgresOptions__ConnectionString__Identity: Server=postgres;Port=5432;Database=identity_service;User Id=identity_service;Password=identity_service;Include Error Detail=true
      PersistMessageOptions__ConnectionString__Identity: Server=postgres;Port=5432;Database=identity_service_persist_message;User Id=identity_service;Password=identity_service;Include Error Detail=true
    ports:
      - "127.0.0.1:5101:8080"
    volumes:
      # Keep the Duende signing keys across container re-creation so issued tokens stay valid.
      - identity-signing-keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    networks:
      - infrastructure

  #######################################################
  #  flight-service (REST :8080, gRPC h2c :8081)
  #######################################################
  flight-service:
    image: booking-flight-service:local
    build:
      context: ../../
      dockerfile: src/Services/Flight.Host/Dockerfile
    container_name: flight-service
    restart: unless-stopped
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: flight-service
      ObservabilityOptions__ServiceName: flight-service
      PostgresOptions__ConnectionString__Flight: Server=postgres;Port=5432;Database=flight_service;User Id=flight_service;Password=flight_service;Include Error Detail=true
      PersistMessageOptions__ConnectionString__Flight: Server=postgres;Port=5432;Database=flight_service_persist_message;User Id=flight_service;Password=flight_service;Include Error Detail=true
      MongoOptions__ConnectionString: mongodb://mongo:27017
      MongoOptions__Flight__ConnectionString: mongodb://mongo:27017
      MongoOptions__Flight__DatabaseName: flight_service_read
    ports:
      - "127.0.0.1:5102:8080"
      - "127.0.0.1:5112:8081"
    depends_on: *infra-dependencies
    healthcheck: *dotnet-healthcheck
    networks:
      - infrastructure

  #######################################################
  #  passenger-service (REST :8080, gRPC h2c :8081, consumes UserCreated)
  #######################################################
  passenger-service:
    image: booking-passenger-service:local
    build:
      context: ../../
      dockerfile: src/Services/Passenger.Host/Dockerfile
    container_name: passenger-service
    restart: unless-stopped
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: passenger-service
      ObservabilityOptions__ServiceName: passenger-service
      PostgresOptions__ConnectionString__Passenger: Server=postgres;Port=5432;Database=passenger_service;User Id=passenger_service;Password=passenger_service;Include Error Detail=true
      PersistMessageOptions__ConnectionString__Passenger: Server=postgres;Port=5432;Database=passenger_service_persist_message;User Id=passenger_service;Password=passenger_service;Include Error Detail=true
      MongoOptions__Passenger__ConnectionString: mongodb://mongo:27017
      MongoOptions__Passenger__DatabaseName: passenger_service_read
    ports:
      - "127.0.0.1:5103:8080"
      - "127.0.0.1:5113:8081"
    depends_on: *infra-dependencies
    healthcheck: *dotnet-healthcheck
    networks:
      - infrastructure

  #######################################################
  #  booking-service (event-sourced; gRPC client of flight + passenger)
  #######################################################
  booking-service:
    image: booking-booking-service:local
    build:
      context: ../../
      dockerfile: src/Services/Booking.Host/Dockerfile
    container_name: booking-service
    restart: unless-stopped
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: booking-service
      ObservabilityOptions__ServiceName: booking-service
      PersistMessageOptions__ConnectionString__Booking: Server=postgres;Port=5432;Database=booking_service_persist_message;User Id=booking_service;Password=booking_service;Include Error Detail=true
      MongoOptions__ConnectionString: mongodb://mongo:27017
      MongoOptions__Booking__DatabaseName: booking_service_read
      EventStoreOptions__ConnectionString: esdb://eventstore:2113?tls=false
      Grpc__FlightAddress: http://flight-service:8081
      Grpc__PassengerAddress: http://passenger-service:8081
      # Only one process may run the EventStoreDB $all subscription.
      Modules__Booking__BackgroundProcessingEnabled: "true"
    ports:
      - "127.0.0.1:5104:8080"
    depends_on:
      <<: *infra-dependencies
      eventstore:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    networks:
      - infrastructure

  #######################################################
  #  gateway (YARP, the only public entry point)
  #######################################################
  gateway:
    image: booking-gateway:local
    build:
      context: ../../
      dockerfile: src/Gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Authority: http://localhost:5000
      Jwt__Audience: booking-modular-monolith
      Jwt__MetadataAddress: http://identity-service:8080/.well-known/openid-configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: gateway
      ObservabilityOptions__ServiceName: gateway
      ObservabilityOptions__UseOTLPExporter: "true"
      ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
      ReverseProxy__Clusters__identity__Destinations__primary__Address: ${IDENTITY_UPSTREAM:-http://identity-service:8080/}
      ReverseProxy__Clusters__flight__Destinations__primary__Address: ${FLIGHT_UPSTREAM:-http://flight-service:8080/}
      ReverseProxy__Clusters__passenger__Destinations__primary__Address: ${PASSENGER_UPSTREAM:-http://passenger-service:8080/}
      ReverseProxy__Clusters__booking__Destinations__primary__Address: ${BOOKING_UPSTREAM:-http://booking-service:8080/}
    depends_on:
      identity-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck: *dotnet-healthcheck
    networks:
      - infrastructure


volumes:
  identity-signing-keys:
