name: booking-modular-monolith

services:
  
  #######################################################
  #  EventStoreDB
  #######################################################
  eventstore:
      container_name: eventstore
      image: eventstore/eventstore:latest
      restart: unless-stopped
      environment:
         - EVENTSTORE_CLUSTER_SIZE=1
         - EVENTSTORE_RUN_PROJECTIONS=All
         - EVENTSTORE_START_STANDARD_PROJECTIONS=True
         - EVENTSTORE_HTTP_PORT=2113
         - EVENTSTORE_INSECURE=True
         - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=True
      ports:
          - "2113:2113"
      networks:
          - booking   

  #######################################################
  #  postgres
  #######################################################
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_prepared_transactions=10"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - booking

  #######################################################
  #  Mongo
  #######################################################
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: unless-stopped
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=root
    #   - MONGO_INITDB_ROOT_PASSWORD=secret
    ports:
      - 27017:27017
    networks:
      - booking

  #######################################################
  #  jaeger 
  # https://www.jaegertracing.io/docs/1.64/deployment/
  # https://www.jaegertracing.io/docs/1.6/deployment/
  #######################################################     
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-all-in-one
    restart: unless-stopped
    ports:
      - "6831:6831/udp" # UDP port for Jaeger agent
      - "16686:16686" # endpoints and Jaeger UI
      - "14268:14268" # HTTP port for accept trace spans directly from clients 
      - "14317:4317" # OTLP gRPC receiver for jaeger
      - "14318:4318" # OTLP http receiver for jaeger
      # - "9411" # Accepts Zipkin spans - /api/v2/spans
    networks:
      - booking

  #######################################################
  #  zipkin 
  # https://zipkin.io/pages/quickstart
  #######################################################  
  zipkin-all-in-one:
    image: openzipkin/zipkin:latest
    container_name: zipkin-all-in-one
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - booking

  #######################################################
  #  prometheus
  # https://prometheus.io/docs/introduction/first_steps/
  # https://prometheus.io/docs/prometheus/3.1/installation/
  # https://grafana.com/docs/grafana-cloud/send-data/metrics/metrics-prometheus/prometheus-config-examples/docker-compose-linux/
  #######################################################  
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./../configs/prometheus.yaml:/etc/prometheus/prometheus.yml
    # to passe one flag, such as "--log.level=debug" or "--web.enable-remote-write-receiver", we need to override the whole command, as we can't just pass one extra argument
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # need this for the OpenTelemetry collector to be able to put metrics into Prometheus
      - "--web.enable-remote-write-receiver"
    #   - "--log.level=debug"
    networks:
      - booking

  #######################################################
  #  otel-collector 
  # https://opentelemetry.io/docs/collector/installation/
  # https://github.com/open-telemetry/opentelemetry-collector
  # https://github.com/open-telemetry/opentelemetry-collector-contrib
  # we can use none contrib docker `otel/opentelemetry-collector` version from `https://github.com/open-telemetry/opentelemetry-collector` repository but,
  # if we need more components like `elasticsearch` we should use `otel/opentelemetry-collector-contrib` image of `https://github.com/open-telemetry/opentelemetry-collector-contrib` repository.  
  #######################################################  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./../configs/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "11888:1888" # pprof extension
      - "8888:8888" # Prometheus metrics exposed by the Collector
      - "8889:8889" # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
      - "55679:55679" # zpages extension
    networks:
      - booking

  #######################################################
  #  rabbitmq
  #######################################################
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    # volumes:
    #   - rabbitmq:/var/lib/rabbitmq
    networks:
      - booking

  #######################################################
  #  Redis
  #######################################################
  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    ports:
      - 6379:6379    
    networks:
      - booking

  #######################################################
  # node-exporter
  # https://prometheus.io/docs/guides/node-exporter/
  # https://grafana.com/docs/grafana-cloud/send-data/metrics/metrics-prometheus/prometheus-config-examples/docker-compose-linux/
  #######################################################     
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    ports:
       - "9101:9100"
    networks:
      - booking

  #######################################################
  #  grafana
  # https://grafana.com/docs/grafana/latest/administration/provisioning/
  # https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
  # https://grafana.com/docs/grafana/latest/setup-grafana/configure-docker/
  # https://github.com/grafana/intro-to-mltp/blob/main/grafana/provisioning/datasources/datasources.yaml
  #######################################################   
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      #      - GF_AUTH_ANONYMOUS_ENABLED=true
      #      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      #      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./../configs/grafana/provisioning:/etc/grafana/provisioning
      - ./../configs/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - booking

  #######################################################
  # tempo
  # https://github.com/grafana/tempo/blob/main/example/docker-compose/otel-collector/docker-compose.yaml
  # https://github.com/grafana/tempo/blob/main/example/docker-compose/shared
  # https://github.com/grafana/tempo/blob/main/example/docker-compose/local
  # https://github.com/grafana/tempo/tree/main/example/docker-compose
  #######################################################     
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./../configs/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200" # tempo
      - "24317:4317" # otlp grpc
      - "24318:4318" # otlp http
    networks:
      - booking

  #######################################################
  # loki
  # https://grafana.com/docs/opentelemetry/collector/send-logs-to-loki/
  # https://github.com/grafana/loki/blob/main/production/docker-compose.yaml
  # https://github.com/grafana/loki/blob/main/examples/getting-started/docker-compose.yaml
  #######################################################
  loki:
    image: grafana/loki:latest
    hostname: loki
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./../configs/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - booking

  #######################################################
  # elasticsearch
  # https://www.elastic.co/guide/en/elasticsearch/reference/7.17/docker.html#docker-compose-file
  #######################################################
  elasticsearch:
    container_name: elasticsearch
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - cluster.name=docker-cluster
      - node.name=docker-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - network.host=0.0.0.0
      - http.port=9200
      - transport.host=localhost
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ports:
      - ${ELASTIC_HOST_PORT:-9200}:${ELASTIC_PORT:-9200}
      - 9300:9300
    networks:
      - booking

  #######################################################
  # kibana
  # https://www.elastic.co/guide/en/kibana/current/docker.html
  #######################################################
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - ${KIBANA_HOST_PORT:-5601}:${KIBANA_PORT:-5601}
    depends_on:
      - elasticsearch
    networks:
      - booking
      
  #######################################################
  # cadvisor
  #######################################################
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - booking

  #######################################################
  #  booking-modular-monolith (original monolith - kept as reference)
  #######################################################
  booking_modular_monolith:
    image: booking-modular-monolith
    build:
      args:
        Version: "1"
      context: ../../
      dockerfile: src/Api/Dockerfile
    container_name: booking_modular_monolith
    ports:
      - 3001:80
      - 3000:443
    volumes:
      - ~/.aspnet/https:/https:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - ASPNETCORE_URLS=https://+;http://+
      - ASPNETCORE_HTTPS_PORT=3000
      - ASPNETCORE_HTTP_PORT=3001
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    networks:
      - booking
    profiles:
      - monolith

  #######################################################
  #  Identity Service
  #######################################################
  identity-api:
    image: identity-api
    build:
      context: ../../
      dockerfile: src/Services/Identity.Api/Dockerfile
    container_name: identity-api
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - ASPNETCORE_URLS=http://+:8080
      - PostgresOptions__ConnectionString__Identity=Server=postgres;Port=5432;Database=identity_service;User Id=postgres;Password=postgres;Include Error Detail=true
      - PersistMessageOptions__ConnectionString=Server=postgres;Port=5432;Database=identity_persist_message;User Id=postgres;Password=postgres;Include Error Detail=true
      - RabbitMqOptions__HostName=rabbitmq
      - RabbitMqOptions__UserName=guest
      - RabbitMqOptions__Password=guest
      - Jwt__Authority=http://identity-api:8080
      - ObservabilityOptions__OTLPOptions__OTLPGrpExporterEndpoint=http://otel-collector:4317
    depends_on:
      - postgres
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking

  #######################################################
  #  Flight Service
  #######################################################
  flight-api:
    image: flight-api
    build:
      context: ../../
      dockerfile: src/Services/Flight.Api/Dockerfile
    container_name: flight-api
    restart: unless-stopped
    ports:
      - "5002:8080"
      - "5003:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - ASPNETCORE_URLS=http://+:8080
      - Kestrel__Endpoints__Grpc__Url=http://+:5003
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - PostgresOptions__ConnectionString__Flight=Server=postgres;Port=5432;Database=flight_service;User Id=postgres;Password=postgres;Include Error Detail=true
      - MongoOptions__ConnectionString=mongodb://mongo:27017
      - MongoOptions__DatabaseName=flight_service_read
      - PersistMessageOptions__ConnectionString=Server=postgres;Port=5432;Database=flight_persist_message;User Id=postgres;Password=postgres;Include Error Detail=true
      - RabbitMqOptions__HostName=rabbitmq
      - RabbitMqOptions__UserName=guest
      - RabbitMqOptions__Password=guest
      - Jwt__Authority=http://identity-api:8080
      - ObservabilityOptions__OTLPOptions__OTLPGrpExporterEndpoint=http://otel-collector:4317
    depends_on:
      - postgres
      - mongo
      - rabbitmq
      - identity-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking

  #######################################################
  #  Passenger Service
  #######################################################
  passenger-api:
    image: passenger-api
    build:
      context: ../../
      dockerfile: src/Services/Passenger.Api/Dockerfile
    container_name: passenger-api
    restart: unless-stopped
    ports:
      - "5005:8080"
      - "5004:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - ASPNETCORE_URLS=http://+:8080
      - Kestrel__Endpoints__Grpc__Url=http://+:5004
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - PostgresOptions__ConnectionString__Passenger=Server=postgres;Port=5432;Database=passenger_service;User Id=postgres;Password=postgres;Include Error Detail=true
      - MongoOptions__ConnectionString=mongodb://mongo:27017
      - MongoOptions__DatabaseName=passenger_service_read
      - PersistMessageOptions__ConnectionString=Server=postgres;Port=5432;Database=passenger_persist_message;User Id=postgres;Password=postgres;Include Error Detail=true
      - RabbitMqOptions__HostName=rabbitmq
      - RabbitMqOptions__UserName=guest
      - RabbitMqOptions__Password=guest
      - Jwt__Authority=http://identity-api:8080
      - ObservabilityOptions__OTLPOptions__OTLPGrpExporterEndpoint=http://otel-collector:4317
    depends_on:
      - postgres
      - mongo
      - rabbitmq
      - identity-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking

  #######################################################
  #  Booking Service
  #######################################################
  booking-api:
    image: booking-api
    build:
      context: ../../
      dockerfile: src/Services/Booking.Api/Dockerfile
    container_name: booking-api
    restart: unless-stopped
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - ASPNETCORE_URLS=http://+:8080
      - MongoOptions__ConnectionString=mongodb://mongo:27017
      - MongoOptions__DatabaseName=booking_service_read
      - EventStoreOptions__ConnectionString=esdb://eventstore:2113?tls=false
      - PersistMessageOptions__ConnectionString=Server=postgres;Port=5432;Database=booking_persist_message;User Id=postgres;Password=postgres;Include Error Detail=true
      - RabbitMqOptions__HostName=rabbitmq
      - RabbitMqOptions__UserName=guest
      - RabbitMqOptions__Password=guest
      - Grpc__FlightAddress=http://flight-api:5003
      - Grpc__PassengerAddress=http://passenger-api:5004
      - Jwt__Authority=http://identity-api:8080
      - ObservabilityOptions__OTLPOptions__OTLPGrpExporterEndpoint=http://otel-collector:4317
    depends_on:
      - mongo
      - eventstore
      - rabbitmq
      - flight-api
      - passenger-api
      - identity-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alive"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - booking

  #######################################################
  #  API Gateway (YARP)
  #######################################################
  api-gateway:
    image: api-gateway
    build:
      context: ../../
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Authority=http://identity-api:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-api:8080
      - ReverseProxy__Clusters__flight-cluster__Destinations__destination1__Address=http://flight-api:8080
      - ReverseProxy__Clusters__passenger-cluster__Destinations__destination1__Address=http://passenger-api:8080
      - ReverseProxy__Clusters__booking-cluster__Destinations__destination1__Address=http://booking-api:8080
    depends_on:
      - identity-api
      - flight-api
      - passenger-api
      - booking-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - booking

networks:
  booking:
    name: booking
    driver: bridge

volumes:
  elastic-data:
  postgres-data: