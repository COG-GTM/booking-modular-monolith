# Multi-service topology (AB-503): YARP gateway + Identity, Flight, Passenger and Booking services
# + shared infrastructure and observability (docker-compose.infrastructure.yaml).
# Run from the repository root:
#   docker compose -f deployments/docker-compose/docker-compose.yaml up -d --build
#   deployments/docker-compose/smoke-test.sh
# The monolith topology was removed with src/Api (AB-505); see docs/runbooks for the cut-over.
#
# Tokens are issued by identity-service with the gateway's public URL as issuer (PUBLIC_GATEWAY_URL);
# every host validates `iss` against it but fetches discovery/JWKS from identity-service directly.
# Each service owns its databases (init/postgres/01-service-databases.sql creates them, with one
# role per service, on the first start of an empty postgres volume).
name: booking-microservices

include:
  - docker-compose.infrastructure.yaml

x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: docker
  Jwt__Authority: ${PUBLIC_GATEWAY_URL:-http://localhost:5000}
  Jwt__MetadataAddress: http://identity-service/.well-known/openid-configuration
  MessageBroker__TransportType: RabbitMq
  MessageBroker__RabbitMq__Host: rabbitmq
  MessageBroker__RabbitMq__Port: "5672"
  MessageBroker__RabbitMq__Username: ${RABBITMQ_USER:-booking}
  MessageBroker__RabbitMq__Password: ${RABBITMQ_PASSWORD:-booking}
  MongoOptions__ConnectionString: mongodb://mongo:27017
  ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
  ObservabilityOptions__UseAspireOTLPExporter: "false"
  ObservabilityOptions__ZipkinOptions__HttpExporterEndpoint: http://zipkin-all-in-one:9411/api/v2/spans
  ObservabilityOptions__JaegerOptions__OTLPGrpcExporterEndpoint: http://jaeger-all-in-one:4317
  ObservabilityOptions__JaegerOptions__HttpExporterEndpoint: http://jaeger-all-in-one:14268/api/traces

# The aspnet runtime image has no curl, so probes speak HTTP over bash's /dev/tcp (`$$` escapes
# compose interpolation; the container sees `$status`). Every host maps /health/live (process only)
# and /health/ready (owned databases, broker and gRPC dependencies) in every environment
# (BuildingBlocks.HealthCheck); compose gates on readiness, which must return 200.
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 30s

x-service-healthcheck: &service-healthcheck
  <<: *healthcheck-timing
  test:
    - CMD
    - bash
    - -c
    - |
      exec 3<>/dev/tcp/127.0.0.1/80
      printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
      IFS= read -r status <&3
      [[ "$$status" == *" 200 "* ]]

services:
  #######################################################
  #  Gateway (single ingress, YARP) -> services
  #######################################################
  gateway:
    image: booking-gateway
    build:
      context: ../../
      dockerfile: src/Gateway/Dockerfile
    container_name: gateway
    ports:
      - "5000:80"
    environment:
      <<: *service-environment
      ReverseProxy__Clusters__identity__Destinations__monolith__Address: http://identity-service:80
      ReverseProxy__Clusters__flight__Destinations__monolith__Address: http://flight-service:80
      ReverseProxy__Clusters__passenger__Destinations__monolith__Address: http://passenger-service:80
      ReverseProxy__Clusters__booking__Destinations__monolith__Address: http://booking-service:80
      # No monolith in this topology: the api-/monolith-fallback routes are rewritten to a path no
      # service maps, so unmatched requests get a 404 (not a 502 or an Identity page).
      ReverseProxy__Clusters__monolith__Destinations__monolith__Address: http://identity-service:80
      ReverseProxy__Routes__api-fallback__Transforms__0__PathSet: /__gateway/unmatched
      ReverseProxy__Routes__monolith-fallback__Transforms__0__PathSet: /__gateway/unmatched
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/80
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
    depends_on:
      identity-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    networks:
      - infrastructure

  #######################################################
  #  Identity service
  #######################################################
  identity-service:
    image: booking-identity
    build:
      context: ../../
      dockerfile: src/Services/Identity.Host/Dockerfile
    container_name: identity-service
    # Service ports are published on loopback for debugging only; clients go through the gateway.
    ports:
      - "127.0.0.1:5100:80"
    environment:
      <<: *service-environment
      AuthOptions__IssuerUri: ${PUBLIC_GATEWAY_URL:-http://localhost:5000}
      # Accept the same `booking-modular-monolith` access tokens as the other services and the
      # monolith, so existing clients keep working when the gateway is repointed.
      PostgresOptions__ConnectionString__Identity: Server=postgres;Port=5432;Database=identity_service;User Id=identity_service;Password=identity_service
      PersistMessageOptions__ConnectionString__Identity: Server=postgres;Port=5432;Database=identity_service_persist_message;User Id=identity_service;Password=identity_service
      MessageBroker__ServiceName: identity
    healthcheck: *service-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      infrastructure:
        aliases: [identity]

  #######################################################
  #  Flight service (HTTP :80, gRPC h2c :81)
  #######################################################
  flight-service:
    image: booking-flight
    build:
      context: ../../
      dockerfile: src/Services/Flight.Host/Dockerfile
    container_name: flight-service
    ports:
      - "127.0.0.1:5200:80"
      - "127.0.0.1:5201:81"
    environment:
      <<: *service-environment
      PostgresOptions__ConnectionString__Flight: Server=postgres;Port=5432;Database=flight_service;User Id=flight_service;Password=flight_service
      PersistMessageOptions__ConnectionString__Flight: Server=postgres;Port=5432;Database=flight_service_persist_message;User Id=flight_service;Password=flight_service
      MongoOptions__Flight__DatabaseName: flight_service_read
      MessageBroker__ServiceName: flight
    healthcheck: *service-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    networks:
      infrastructure:
        aliases: [flight]

  #######################################################
  #  Passenger service (HTTP :80, gRPC h2c :81)
  #######################################################
  passenger-service:
    image: booking-passenger
    build:
      context: ../../
      dockerfile: src/Services/Passenger.Host/Dockerfile
    container_name: passenger-service
    ports:
      - "127.0.0.1:5300:80"
      - "127.0.0.1:5301:81"
    environment:
      <<: *service-environment
      PostgresOptions__ConnectionString__Passenger: Server=postgres;Port=5432;Database=passenger_service;User Id=passenger_service;Password=passenger_service
      PersistMessageOptions__ConnectionString__Passenger: Server=postgres;Port=5432;Database=passenger_service_persist_message;User Id=passenger_service;Password=passenger_service
      MongoOptions__Passenger__DatabaseName: passenger_service_read
      MessageBroker__ServiceName: passenger
    healthcheck: *service-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    networks:
      infrastructure:
        aliases: [passenger]

  #######################################################
  #  Booking service (calls Flight/Passenger over gRPC)
  #######################################################
  booking-service:
    image: booking-booking
    build:
      context: ../../
      dockerfile: src/Services/Booking.Host/Dockerfile
    container_name: booking-service
    ports:
      - "127.0.0.1:5400:80"
    environment:
      <<: *service-environment
      EventStoreOptions__ConnectionString: esdb://eventstore:2113?tls=false
      PersistMessageOptions__ConnectionString__Booking: Server=postgres;Port=5432;Database=booking_service_persist_message;User Id=booking_service;Password=booking_service
      MongoOptions__Booking__DatabaseName: booking_service_read
      MessageBroker__ServiceName: booking
      Grpc__FlightAddress: http://flight:81
      Grpc__PassengerAddress: http://passenger:81
    healthcheck: *service-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eventstore:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
    networks:
      infrastructure:
        aliases: [booking]
