name: booking-modular-monolith

include:
  - path: docker-compose.infrastructure.yaml

services:
  identity-service:
    image: booking-identity-service
    build:
      context: ../../
      dockerfile: src/Services/Identity.Host/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5103:80"
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      AuthOptions__IssuerUri: http://localhost:5000
      Jwt__Authority: http://localhost:5000
      Jwt__MetadataAddress: http://localhost:80/.well-known/openid-configuration
      PostgresOptions__ConnectionString__Identity: Server=postgres;Port=5432;Database=identity_service;User Id=identity_service;Password=identity_service;Include Error Detail=true
      RabbitMqOptions__HostName: rabbitmq
      RabbitMqOptions__Port: "5672"
      RabbitMqOptions__UserName: booking
      RabbitMqOptions__Password: booking
      ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
      ObservabilityOptions__UseAspireOTLPExporter: "false"
      OTEL_SERVICE_NAME: identity-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS=' ' read -r _ status _ <&3; test \"$$status\" = \"200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - infrastructure

  flight-service:
    image: booking-flight-service
    build:
      context: ../../
      dockerfile: src/Services/Flight.Host/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5107:80"
      - "127.0.0.1:5106:81"
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      Jwt__Authority: http://localhost:5000
      Jwt__Audience: booking-modular-monolith
      Jwt__MetadataAddress: http://identity-service:80/.well-known/openid-configuration
      PostgresOptions__ConnectionString__Flight: Server=postgres;Port=5432;Database=flight_service;User Id=flight_service;Password=flight_service;Include Error Detail=true
      MongoOptions__ConnectionString: mongodb://mongo:27017
      MongoOptions__Flight__DatabaseName: flight_service_read
      RabbitMqOptions__HostName: rabbitmq
      RabbitMqOptions__Port: "5672"
      RabbitMqOptions__UserName: booking
      RabbitMqOptions__Password: booking
      ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
      ObservabilityOptions__UseAspireOTLPExporter: "false"
      OTEL_SERVICE_NAME: flight-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS=' ' read -r _ status _ <&3; test \"$$status\" = \"200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - infrastructure

  passenger-service:
    image: booking-passenger-service
    build:
      context: ../../
      dockerfile: src/Services/Passenger.Host/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5102:80"
      - "127.0.0.1:5202:81"
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      Jwt__Authority: http://localhost:5000
      Jwt__Audience: booking-modular-monolith
      Jwt__MetadataAddress: http://identity-service:80/.well-known/openid-configuration
      PostgresOptions__ConnectionString__Passenger: Server=postgres;Port=5432;Database=passenger_service;User Id=passenger_service;Password=passenger_service;Include Error Detail=true
      MongoOptions__ConnectionString: mongodb://mongo:27017
      MongoOptions__Passenger__DatabaseName: passenger_service_read
      RabbitMqOptions__HostName: rabbitmq
      RabbitMqOptions__Port: "5672"
      RabbitMqOptions__UserName: booking
      RabbitMqOptions__Password: booking
      ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
      ObservabilityOptions__UseAspireOTLPExporter: "false"
      OTEL_SERVICE_NAME: passenger-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS=' ' read -r _ status _ <&3; test \"$$status\" = \"200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - infrastructure

  booking-service:
    image: booking-booking-service
    build:
      context: ../../
      dockerfile: src/Services/Booking.Host/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5004:80"
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      Jwt__Authority: http://localhost:5000
      Jwt__Audience: booking-modular-monolith
      Jwt__MetadataAddress: http://identity-service:80/.well-known/openid-configuration
      PostgresOptions__ConnectionString__Booking: Server=postgres;Port=5432;Database=booking_service;User Id=booking_service;Password=booking_service;Include Error Detail=true
      MongoOptions__ConnectionString: mongodb://mongo:27017
      MongoOptions__Booking__DatabaseName: booking_service_read
      EventStoreOptions__ConnectionString: esdb://eventstore:2113?tls=false
      RabbitMqOptions__HostName: rabbitmq
      RabbitMqOptions__Port: "5672"
      RabbitMqOptions__UserName: booking
      RabbitMqOptions__Password: booking
      Services__flight__grpc__0: http://flight-service:81
      Services__passenger__grpc__0: http://passenger-service:81
      ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
      ObservabilityOptions__UseAspireOTLPExporter: "false"
      OTEL_SERVICE_NAME: booking-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      eventstore:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS=' ' read -r _ status _ <&3; test \"$$status\" = \"200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - infrastructure

  gateway:
    image: booking-gateway
    build:
      context: ../../
      dockerfile: src/Gateway/Dockerfile
    container_name: booking_gateway
    restart: unless-stopped
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: docker
      Jwt__Authority: http://localhost:5000
      Jwt__MetadataAddress: http://identity-service:80/.well-known/openid-configuration
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity-service:80/
      ReverseProxy__Clusters__flight__Destinations__primary__Address: http://flight-service:80/
      ReverseProxy__Clusters__passenger__Destinations__primary__Address: http://passenger-service:80/
      ReverseProxy__Clusters__booking__Destinations__primary__Address: http://booking-service:80/
      ReverseProxy__Clusters__monolith__Destinations__primary__Address: http://identity-service:80/
      ReverseProxy__Routes__api-fallback__Transforms__0__PathSet: /__gateway/unmatched
      ReverseProxy__Routes__monolith-fallback__Transforms__0__PathSet: /__gateway/unmatched
      ObservabilityOptions__OTLPOptions__OTLPGrpcExporterEndpoint: http://otel-collector:4317
      ObservabilityOptions__UseAspireOTLPExporter: "false"
      OTEL_SERVICE_NAME: booking-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      identity-service:
        condition: service_healthy
      flight-service:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS=' ' read -r _ status _ <&3; test \"$$status\" = \"200\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - infrastructure
