global:
  scrape_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  # Collector OTLP metrics are the primary dashboard source. Direct scrapes
  # remain available for diagnosis; select a job rather than summing both.
  - job_name: booking-services-direct
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service_name: gateway
      - targets: ['identity-service:8080']
        labels:
          service_name: identity-service
      - targets: ['flight-service:8080']
        labels:
          service_name: flight-service
      - targets: ['passenger-service:8080']
        labels:
          service_name: passenger-service
      - targets: ['booking-service:8080']
        labels:
          service_name: booking-service

  # Bind local hosts to 0.0.0.0. Gateway has no launchSettings.json;
  # use ASPNETCORE_URLS=http://0.0.0.0:5000.
  - job_name: booking-services-local
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']
        labels:
          service_name: gateway
      - targets: ['host.docker.internal:5101']
        labels:
          service_name: identity-service
      - targets: ['host.docker.internal:5102']
        labels:
          service_name: flight-service
      - targets: ['host.docker.internal:5103']
        labels:
          service_name: passenger-service
      - targets: ['host.docker.internal:5104']
        labels:
          service_name: booking-service