apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  - name: Jaeger
    type: jaeger
    uid: jaeger-uid
    access: proxy
    url: http://jaeger-all-in-one:16686
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo-uid
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus-uid
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki-uid
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags: [{ key: 'service.name', value: 'service_name' }]
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id = "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus-uid
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags: [{ key: 'service.name', value: 'service' }]
        queries:
          - name: Span rate
            query: 'sum(rate(traces_spanmetrics_calls_total{$${__tags}}[5m]))'
      streamingEnabled:
        search: true

  - name: Loki
    type: loki
    uid: loki-uid
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo-uid
          matcherType: label
          matcherRegex: trace_id
          name: trace_id
          url: '$${__value.raw}'