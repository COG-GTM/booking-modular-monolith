# Local kind cluster (see deployments/kubernetes/README.md). Images are built locally and `kind load`ed,
# infrastructure runs in-cluster, ingress-nginx publishes the gateway on http://localhost:8080.
global:
  image:
    tag: dev
    pullPolicy: Never
  publicUrl: http://localhost:8080
  waitForDependencies:
    enabled: true
  env:
    # Pod CIDR of the kind cluster (networking.podSubnet in kind-config.yaml): ingress-nginx runs there,
    # so the gateway trusts its X-Forwarded-For when partitioning the rate limiter.
    TrustedProxyOptions__KnownNetworks__0: 10.244.0.0/16
    # No OTLP collector in the kind overlay.
    ObservabilityOptions__UseOTLPExporter: "false"
    ObservabilityOptions__UseAspireOTLPExporter: "false"

defaults:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80

services:
  identity-service:
    # Created by deployments/kubernetes/kind-up.sh from a key generated by the identity image itself.
    signingKey:
      existingSecret: identity-signing-key

infrastructure:
  enabled: true
