{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $ing.service }}
  labels:
    {{- include "booking.labels" (dict "root" $ "name" $ing.service "component" "ingress") | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with $ing.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ $ing.service }}
                port:
                  name: {{ $ing.servicePort }}
{{- end }}
