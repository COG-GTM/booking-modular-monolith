{{- range $name, $raw := .Values.services }}
{{- if $raw.enabled }}
{{- $svc := include "booking.serviceConfig" (dict "root" $ "svc" $raw) | fromYaml }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
{{- $g := $.Values.global }}
{{- $signing := $svc.signingKey | default dict }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "booking.labels" $ctx | nindent 4 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "booking.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking.labels" $ctx | nindent 8 }}
        {{- with $svc.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "booking.env" $ctx | sha256sum }}
        {{- if not $svc.existingSecret }}
        checksum/secret: {{ toYaml ($svc.secretEnv | default dict) | sha256sum }}
        {{- end }}
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Docker-link style env vars (e.g. EVENTSTORE_SERVICE_PORT) leak into apps that bind config from env.
      enableServiceLinks: false
      {{- with $g.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $g.waitForDependencies.enabled $svc.dependsOn }}
      initContainers:
        - name: wait-for-dependencies
          image: {{ $g.waitForDependencies.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for target in {{ join " " $svc.dependsOn }}; do
                host="${target%%:*}"; port="${target##*:}"
                until nc -z -w 2 "$host" "$port"; do echo "waiting for $target"; sleep 2; done
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "booking.image" $ctx }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          {{- with $g.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "booking.configMapName" $ctx }}
            - secretRef:
                name: {{ include "booking.secretName" $ctx }}
          {{- with $svc.probes.startup }}
          startupProbe:
            httpGet: {path: {{ .path }}, port: {{ $svc.probePort }}}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with $svc.probes.liveness }}
          livenessProbe:
            httpGet: {path: {{ .path }}, port: {{ $svc.probePort }}}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with $svc.probes.readiness }}
          readinessProbe:
            httpGet: {path: {{ .path }}, port: {{ $svc.probePort }}}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $signing.existingSecret }}
          volumeMounts:
            # AddDeveloperSigningCredential() reads tempkey.jwk from the working directory (/app).
            - name: signing-key
              mountPath: /app/tempkey.jwk
              subPath: tempkey.jwk
              readOnly: true
          {{- end }}
      {{- if $signing.existingSecret }}
      volumes:
        - name: signing-key
          secret:
            secretName: {{ $signing.existingSecret }}
            items:
              - key: {{ $signing.key | default "tempkey.jwk" }}
                path: tempkey.jwk
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
