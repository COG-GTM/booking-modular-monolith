{{- range $name, $raw := .Values.services }}
{{- if $raw.enabled }}
{{- $svc := include "booking.serviceConfig" (dict "root" $ "svc" $raw) | fromYaml }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Service
metadata:
  # Named exactly like the docker-compose service so http://<name>:<port> works unchanged in-cluster.
  name: {{ $name }}
  labels:
    {{- include "booking.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "booking.selectorLabels" $ctx | nindent 4 }}
  ports:
    {{- range $svc.ports }}
    - name: {{ .name }}
      port: {{ .servicePort | default .containerPort }}
      targetPort: {{ .name }}
      protocol: TCP
      {{- with .appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
