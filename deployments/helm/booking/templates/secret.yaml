{{- range $name, $raw := .Values.services }}
{{- if $raw.enabled }}
{{- $svc := include "booking.serviceConfig" (dict "root" $ "svc" $raw) | fromYaml }}
{{- if not $svc.existingSecret }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.secretName" $ctx }}
  labels:
    {{- include "booking.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := ($svc.secretEnv | default dict) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
