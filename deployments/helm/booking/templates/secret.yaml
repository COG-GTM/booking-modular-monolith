{{- range $name, $raw := .Values.services }}
{{- if and $raw.enabled (not $raw.existingSecret) }}
{{- $ctx := dict "root" $ "name" $name "svc" $raw }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.secretName" $ctx }}
  labels:
    {{- include "booking.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := ($raw.secretEnv | default dict) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
