kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: ${KIND_HTTP_PORT:-8088}
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
