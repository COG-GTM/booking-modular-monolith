{{- if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "booking.serviceName" (dict "root" . "key" "gateway") }}
  labels:
    {{- include "booking.commonLabels" (dict "root" . "name" (include "booking.serviceName" (dict "root" . "key" "gateway"))) | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  {{- with .Values.gateway.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        - {{ $.Values.gateway.ingress.host | quote }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "booking.serviceName" (dict "root" . "key" "gateway") }}
                port:
                  number: 8080
{{- end }}
