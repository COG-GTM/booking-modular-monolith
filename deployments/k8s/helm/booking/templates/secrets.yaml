{{- range $key, $service := .Values.services }}
{{- if and $service.database (not $service.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.databaseSecret" (dict "root" $ "key" $key) }}
  labels:
    {{- include "booking.commonLabels" (dict "root" $ "name" (include "booking.serviceName" (dict "root" $ "key" $key))) | nindent 4 }}
type: Opaque
stringData:
  {{ $service.database.passwordKey }}: {{ default $service.database.username $service.database.password | quote }}
{{- end }}
{{- end }}
{{- if not .Values.rabbitmq.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.rabbitSecret" . }}
  labels:
    {{- include "booking.commonLabels" (dict "root" $ "name" "rabbitmq-auth") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.rabbitmq.auth.usernameKey }}: {{ .Values.rabbitmq.auth.username | quote }}
  {{ .Values.rabbitmq.auth.passwordKey }}: {{ .Values.rabbitmq.auth.password | quote }}
{{- end }}
{{- if not .Values.mongodb.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.mongoSecret" . }}
  labels:
    {{- include "booking.commonLabels" (dict "root" $ "name" "mongodb-connection") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mongodb.connectionStringKey }}: {{ default (printf "mongodb://%s:27017" (include "booking.mongoHost" .)) .Values.mongodb.connectionString | quote }}
{{- end }}
{{- if and .Values.services.booking (not .Values.eventstore.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.eventstoreSecret" . }}
  labels:
    {{- include "booking.commonLabels" (dict "root" $ "name" "eventstore-connection") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.eventstore.connectionStringKey }}: {{ default (printf "esdb://%s:2113?tls=false" (include "booking.eventstoreHost" .)) .Values.eventstore.connectionString | quote }}
{{- end }}
{{- if and .Values.infrastructure.enabled (not .Values.infrastructure.postgres.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "booking.postgresSecret" . }}
  labels:
    {{- include "booking.commonLabels" (dict "root" $ "name" "postgres-admin") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.infrastructure.postgres.passwordKey }}: {{ .Values.infrastructure.postgres.password | quote }}
{{- end }}
